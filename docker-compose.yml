services:
  backend:
    build: .
    container_name: openshorts-backend
    # 127.0.0.1: reachable only from this computer. To open the panel on the
    # network or the internet, define the access password first
    # (definir-senha.bat) and then remove the "127.0.0.1:" prefixes.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    # Gaming Edition (local install) defaults. Every value can be overridden in
    # .env; docker compose reads that file for the ${VAR:-default} below.
    #  - nothing produced is deleted automatically (0 = keep): the video
    #    library and the originals stay until the user removes them;
    #  - gameplay recordings are large, so the upload limit is 20 GB.
    environment:
      - JOB_RETENTION_SECONDS=${JOB_RETENTION_SECONDS:-0}
      - OUTPUT_MAX_GB=${OUTPUT_MAX_GB:-0}
      - UPLOADS_MAX_GB=${UPLOADS_MAX_GB:-0}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-20480}
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "127.0.0.1:5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
